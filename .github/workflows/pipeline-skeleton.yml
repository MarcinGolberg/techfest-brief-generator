name: "DevSecOps Pipeline - Team 4"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  diagnostic-check:
    name: "Python & Docker Check"
    runs-on: hackaton-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Python Venv Hello World
        run: |
          python3 -m venv test_venv
          source test_venv/bin/activate
          python3 -c "print('Hello World from Python Venv!')"
          deactivate

      - name: Docker Hello World
        run: |
          docker run --rm hello-world
