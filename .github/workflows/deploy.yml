name: "DevSecOps Pipeline - Team 4"

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  # JOBS 1, 2, 3 (Secret Scan, Vulnerability Scan, SBOM) remain unchanged.
  secret-scan:
    name: "Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  vulnerability-scan:
    name: "Vulnerability Scan (Bandit + Safety)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install bandit safety
          bandit -r . --severity-level high --confidence-level high -f json -o bandit-report.json --exit-zero
          safety check --full-report --output json > safety-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-reports
          path: |
            bandit-report.json
            safety-report.json

  sbom-generation:
    name: "SBOM Generation & Upload (CycloneDX)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
      - name: Send SBOM to DependencyTrack
        env:
          DEPENDENCYTRACK_URL: ${{ secrets.DEPENDENCYTRACK_URL }}
          DEPENDENCYTRACK_API_KEY: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          DEPENDENCYTRACK_PROJECT_UUID: ${{ secrets.DEPENDENCYTRACK_PROJECT_UUID }}
        run: |
          if [ -z "$DEPENDENCYTRACK_URL" ]; then exit 0; fi
          SBOM_BASE64=$(base64 -w 0 sbom.json)
          PAYLOAD=$(python3 -c "import json; print(json.dumps({'project': '$DEPENDENCYTRACK_PROJECT_UUID', 'bom': '$SBOM_BASE64'}))")
          curl -s -X PUT -H "Content-Type: application/json" -H "X-Api-Key: ${DEPENDENCYTRACK_API_KEY}" -d "${PAYLOAD}" "${DEPENDENCYTRACK_URL}/api/v1/bom"

  sonarqube-analysis:
    name: "Quality Gate — SonarQube"
    runs-on: ubuntu-latest
    needs: [ vulnerability-scan, sbom-generation ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml:coverage.xml || echo "No tests."
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.python.coverage.reportPaths=coverage.xml

  # ============================================================
  # NEW JOB 5: DOCKER BUILD, SCAN (TRIVY) & PUSH
  # ============================================================
  build-and-push-docker:
    name: "Docker Build, Scan & Push"
    runs-on: ubuntu-latest
    needs: sonarqube-analysis
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: acrtf3team04.azurecr.io
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build Docker Image
        run: |
          docker build -t acrtf3team04.azurecr.io/team4-app:${{ github.sha }} .
          docker tag acrtf3team04.azurecr.io/team4-app:${{ github.sha }} acrtf3team04.azurecr.io/team4-app:latest

      - name: Run Trivy vulnerability scanner (Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'acrtf3team04.azurecr.io/team4-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'  # Fail pipeline if vulnerabilities found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to ACR
        run: |
          docker push acrtf3team04.azurecr.io/team4-app:${{ github.sha }}
          docker push acrtf3team04.azurecr.io/team4-app:latest

  # ============================================================
  # UPDATED JOB 6: DEPLOY FROM ACR IMAGE
  # ============================================================
  deploy:
    name: "Deploy Container to Azure App Service"
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'accenturebrief'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'acrtf3team04.azurecr.io/team4-app:${{ github.sha }}'